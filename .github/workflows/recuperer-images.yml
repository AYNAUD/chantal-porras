name: Récupérer les photos de l'ancien site

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-save sharp@0.34.4
      - run: npm run images
      - name: Enregistrer les photos dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images
          if git diff --cached --quiet; then echo "Aucune nouvelle photo"; exit 0; fi
          git commit -m "Ajoute les photos récupérées de l'ancien site"
          git push
